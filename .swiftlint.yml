# SwiftLint Configuration File

# Paths to exclude from linting
excluded:
  - Pods
  - build
  - .build
  - DerivedData
  - swiftly.playground

# Paths to include (optional, by default all Swift files are included)
included:
  - sublime/src

# Rules to disable
disabled_rules:
  - trailing_whitespace

# Rules to enable (opt-in rules)
opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicit_return
  - modifier_order
  - redundant_type_annotation
  - sorted_imports

# Configure specific rules
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

type_name:
  min_length: 3
  max_length:
    warning: 40
    error: 50

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - x
    - y
    - z

# Force Cast Rule
force_cast: warning

# Force Try Rule
force_try: warning

# Cyclomatic Complexity
cyclomatic_complexity:
  warning: 10
  error: 20

# Nesting
nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

# Reporter type
reporter: "xcode"
